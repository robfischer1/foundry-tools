# THE FLEET'S MYPY CONFIGURATION — read by foundry-tools' python:mypy atom at
# /rulesets/mypy.ini via --config-file, which makes mypy ignore
# the [tool.mypy] table the repository's pyproject.toml carries. See
# ruff.toml beside this file for why the ruleset has one home; the same
# reasoning, the same origin (python-repo-template pyproject.toml.jinja).
#
# The confluent_kafka override was poured only for MCP stars; it is harmless
# for a star that never imports it, so it is unconditional here.

[mypy]
python_version = 3.14
strict = True
warn_return_any = True
warn_unused_configs = True

# THIRD PARTIES THAT SHIP NO STUBS AND NO py.typed. The union of every
# [[tool.mypy.overrides]] the fleet's pyproject files carried on 2026-09-11
# (iris, nereus, mnemosyne, narcissus, terpsichore, helios), each a fact about
# the library, not the repo. Measured the day the atoms started reading this
# file: terpsichore red on `pgvector.sqlalchemy … missing library stubs or
# py.typed marker`, an override its own pyproject had and this file did not.
[mypy-confluent_kafka.*]
ignore_missing_imports = True

[mypy-psycopg.*]
ignore_missing_imports = True

[mypy-pgvector.*]
ignore_missing_imports = True

[mypy-opentelemetry.exporter.otlp.proto.http.*]
ignore_missing_imports = True

[mypy-opentelemetry.exporter.otlp.proto.common.*]
ignore_missing_imports = True

# FIRST-PARTY PACKAGES THAT SHIP NO py.typed — DEBT, NOT POLICY. forge_testkit,
# chaos, stellar_core and urania are ours; a consumer ignoring their types
# because they carry no marker is the fleet lying to itself about its own
# SDKs. Each entry here is a to-do on that package (add py.typed to the
# wheel), and the entry goes the day it ships one.
[mypy-forge_testkit.*]
ignore_missing_imports = True

[mypy-chaos.*]
ignore_missing_imports = True

[mypy-stellar_core.*]
ignore_missing_imports = True

[mypy-urania.*]
ignore_missing_imports = True

[mypy-tests.*]
disallow_untyped_defs = False
disallow_untyped_calls = False
disallow_incomplete_defs = False
check_untyped_defs = False
warn_return_any = False
