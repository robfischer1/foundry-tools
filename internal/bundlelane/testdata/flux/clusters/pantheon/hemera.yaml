apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hemera
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure
    - name: alloy
    - name: alloy-node
  interval: 10m
  path: ./hemera
  prune: true
  wait: false

  ignore:
    - paths: ["/spec/volumeName"]
      target:
        kind: PersistentVolumeClaim

  sourceRef:
    kind: GitRepository
    name: flux-system
