---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: calypso-db-store
spec:
  configuration:
    destinationPath: s3://cnpg/calypso-db
    endpointURL: http://seaweedfs.objects.svc.cluster.local:8333
    s3Credentials:
      accessKeyId: {name: fleet-s3-credentials, key: access_key_id}
      secretAccessKey: {name: fleet-s3-credentials, key: secret_access_key}
    data:
      compression: lz4
    wal:
      compression: gzip
      maxParallel: 4
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: calypso-db
spec:
  instances: 1
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-bookworm
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [nas01]
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  postgresUID: 26
  postgresGID: 26
  postgresql:
    parameters:
      pg_stat_statements.max: "5000"
      pg_stat_statements.track: "top"
      shared_buffers: "128MB"
      effective_cache_size: "384MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      max_connections: "200"
      max_worker_processes: "32"
      max_wal_senders: "32"
      max_locks_per_transaction: "64"
      max_prepared_transactions: "0"
      checkpoint_completion_target: "0.9"
      wal_compression: "pglz"
  bootstrap:
    pg_basebackup:
      source: aether-db
      database: calypso
      owner: calypso
  replica:
    enabled: false
    source: aether-db
  externalClusters:
    - name: aether-db
      connectionParameters:
        host: aether-db-rw.data.svc.cluster.local
        user: streaming_replica
        dbname: postgres
        sslmode: verify-full
      sslCert: {name: aether-db-streaming-replica, key: tls.crt}
      sslKey: {name: aether-db-streaming-replica, key: tls.key}
      sslRootCert: {name: aether-db-ca, key: ca.crt}
  storage:
    size: 30Gi
    storageClass: gaia
    resizeInUseVolumes: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: calypso-db-store
        serverName: calypso-db-data
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: calypso-db-daily
spec:
  schedule: "0 30 1 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: calypso-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
