---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cnpg-replication-ca
spec:
  isCA: true
  commonName: notusmi.com CNPG replication CA
  secretName: cnpg-replication-ca  # the Secret's NAME, not a value
  duration: 87600h
  renewBefore: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
  usages:
    - cert sign
    - crl sign
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: cnpg-replication
spec:
  ca:
    secretName: cnpg-replication-ca  # the signer Secret, by NAME
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aether-db-replication
spec:
  secretName: aether-db-streaming-replica  # the Secret's NAME, not a value
  commonName: streaming_replica
  duration: 2160h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - client auth
  issuerRef:
    name: cnpg-replication
    kind: Issuer
    group: cert-manager.io
---
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aether-db-client-ca
spec:
  refreshInterval: 15m
  secretStoreRef: {name: cluster-cert-manager, kind: ClusterSecretStore}
  target:
    name: aether-db-client-ca
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        ca.crt: |
          {{ .spire_root | trim }}
          {{ .replication_ca | trim }}
  data:
    - secretKey: spire_root
      sourceRef:
        storeRef: {name: cluster-data, kind: ClusterSecretStore}
      remoteRef: {key: fleet-root-ca-2-public, property: ca.crt}
    - secretKey: replication_ca
      sourceRef:
        storeRef: {name: cluster-data, kind: ClusterSecretStore}
      remoteRef: {key: cnpg-replication-ca, property: ca.crt}

