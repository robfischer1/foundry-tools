---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: argus-db-store
spec:
  configuration:
    destinationPath: s3://cnpg/argus-db
    endpointURL: http://seaweedfs.objects.svc.cluster.local:8333
    s3Credentials:
      accessKeyId: {name: fleet-s3-credentials, key: access_key_id}
      secretAccessKey: {name: fleet-s3-credentials, key: secret_access_key}
    data:
      compression: lz4
    wal:
      compression: gzip
      maxParallel: 4
  retentionPolicy: 30d
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: argus-db
spec:
  instances: 1
  enablePDB: false
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  primaryUpdateStrategy: unsupervised
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - {key: kubernetes.io/hostname, operator: In, values: [llm01]}
  resources:
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
  postgresUID: 26
  postgresGID: 26
  bootstrap:
    pg_basebackup:
      source: argus-db-prime
      database: grafana
      owner: grafana
      secret:
        name: argus-db-app
  replica:
    enabled: false
    source: argus-db-prime
  externalClusters:
    - name: argus-db-prime
      connectionParameters:
        host: argus-db-rw.prime.svc.cluster.local
        user: streaming_replica
        dbname: postgres
        sslmode: verify-ca
  postgresql:
    parameters:
      max_connections: "200"
  storage:
    size: 4Gi
    storageClass: gaia
    resizeInUseVolumes: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: argus-db-store
        serverName: argus-db-data
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: argus-db-daily
spec:
  schedule: "0 30 0 * * *"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: argus-db
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
