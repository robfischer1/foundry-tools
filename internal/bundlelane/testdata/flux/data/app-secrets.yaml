---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aether-db-app
spec:
  refreshInterval: 1h
  secretStoreRef: {name: cluster-default, kind: ClusterSecretStore}
  target:
    name: aether-db-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
  dataFrom:
    - extract:
        key: aether-db-app
