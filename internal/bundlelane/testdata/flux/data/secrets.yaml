apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: fleet-s3-credentials
spec:
  refreshInterval: 1h
  secretStoreRef: {name: calypso, kind: ClusterSecretStore}
  target:
    name: fleet-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: access_key_id
      remoteRef: {key: /hosts/nas01/FLEET_S3_ACCESS_KEY_ID}
    - secretKey: secret_access_key
      remoteRef: {key: /hosts/nas01/FLEET_S3_SECRET_ACCESS_KEY}
