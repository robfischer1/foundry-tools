---
apiVersion: v1
kind: Secret
metadata:
  name: aether-db-ca-public
type: Opaque
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: aether-db-ca-public
spec:
  refreshInterval: 15m
  secretStoreRefs:
    - {name: cluster-data, kind: ClusterSecretStore}
  selector:
    secret: {name: aether-db-ca}
  data:
    - match:
        secretKey: ca.crt
        remoteRef: {remoteKey: aether-db-ca-public, property: ca.crt}
