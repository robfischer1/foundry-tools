apiVersion: v1
kind: ConfigMap
metadata:
  name: star-spiffe-helper
  namespace: prime
data:
  helper.conf: |
    agent_address = "/run/spire/agent/public/api.sock"
    cert_dir = "/var/run/secrets/svid"
    daemon_mode = true
    svid_file_name = "svid.pem"
    svid_key_file_name = "svid_key.pem"
    svid_bundle_file_name = "svid_bundle.pem"
    health_checks {
      listener_enabled = true
      bind_port = 18081
      liveness_path = "/live"
      readiness_path = "/ready"
    }
