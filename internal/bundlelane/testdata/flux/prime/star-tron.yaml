---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tron-redis-sa
  namespace: prime
  labels: {owner: rob}
  annotations:
    email: owner@example.invalid
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    email: owner@example.invalid
  name: tron-redis
  namespace: prime
  labels: {owner: rob, app: tron-redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tron-redis}
  strategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: tron-redis}
    spec:
      restartPolicy: Always
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      serviceAccountName: tron-redis-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          livenessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          image: docker.io/library/redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits:   {memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: 6379}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          ports:
            - {name: redis, containerPort: 6379}
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tron-redis
  namespace: prime
spec:
  selector: {app: tron-redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379, protocol: TCP}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tron-sa
  namespace: prime
  labels: {owner: rob}
  annotations:
    email: owner@example.invalid
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    email: owner@example.invalid
  name: tron
  namespace: prime
  labels: {owner: rob, app: tron, pistis.star: tron}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tron}
  strategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: tron, pistis.star: tron}
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      serviceAccountName: tron-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: tron
