---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nomos-sa
  namespace: prime
  labels: {owner: rob}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nomos
  namespace: prime
  labels: {owner: rob, app: nomos, pistis.star: nomos}
spec:
  replicas: 1
  selector:
    matchLabels: {app: nomos}
  strategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: nomos, pistis.star: nomos}
    spec:
      restartPolicy: Always
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      serviceAccountName: nomos-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: nomos
          livenessProbe:
            tcpSocket: {port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          image: registry.notusmi.com/rob/nomos
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits:   {memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: ["/nomos", "readycheck"]}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          envFrom:
            - configMapRef: {name: fleet-env}
            - configMapRef: {name: peer-endpoints}
          env:
            - name: NOMOS_HADES_URL
              valueFrom: {configMapKeyRef: {name: peer-endpoints, key: HADES_MTLS_URL}}
            - {name: NOMOS_STOCKS_URL, value: "http://ourea.prime.svc.cluster.local:8215/foundry/foundry-stocks.git"}
            - {name: NOMOS_STOCKS_CACHE, value: "/var/cache/nomos"}
            - name: NOMOS_POLICY_URL
              valueFrom: {configMapKeyRef: {name: peer-endpoints, key: OURANOS_URL}}
            - {name: NOMOS_STOCKS_GIT, value: "http://ourea.prime.svc.cluster.local:8215/foundry/foundry-stocks.git"}
            - {name: NOMOS_HOST, value: "0.0.0.0"}
            - {name: NOMOS_OTEL_ENABLED, value: "true"}
            - {name: NOMOS_PORT, value: "8000"}
            - {name: OTEL_SERVICE_NAME, value: "nomos"}
            - {name: PORT, value: "8000"}
          ports:
            - {name: mcp,  containerPort: 8000}
            - {name: mtls, containerPort: 8001}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: stocks, mountPath: /var/cache/nomos}
            - {name: spire-socket, mountPath: /run/spire/agent/public, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: stocks, emptyDir: {sizeLimit: 128Mi}}
        - name: spire-socket
          hostPath: {path: /run/spire-k8s/agent/public, type: Directory}
---
apiVersion: v1
kind: Service
metadata:
  name: nomos
  namespace: prime
spec:
  selector: {app: nomos}
  ports:
    - {name: mcp,  port: 8000, targetPort: 8000, protocol: TCP}
    - {name: mtls, port: 8001, targetPort: 8001, protocol: TCP}
