---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-sa
  namespace: prime
  labels: {owner: rob}
  annotations:
    email: owner@example.invalid
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    email: owner@example.invalid
  name: chaos
  namespace: prime
  labels: {owner: rob, app: chaos, pistis.star: chaos}
spec:
  replicas: 1
  selector:
    matchLabels: {app: chaos}
  strategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: chaos, pistis.star: chaos}
    spec:
      restartPolicy: Always
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      serviceAccountName: chaos-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: chaos
          livenessProbe:
            tcpSocket: {port: 8206}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          image: registry.notusmi.com/rob/chaos
          resources:
            requests: {cpu: 10m, memory: 256Mi}
            limits:   {memory: 1Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: ['/chaos', 'readycheck']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          envFrom:
            - configMapRef: {name: fleet-env}
            - configMapRef: {name: peer-endpoints}
          env:
            - {name: CHAOS_CARDINALITY_GUARD_MODE, value: "warn"}
            - {name: CHAOS_GRAPH_GUARD_MODE, value: "enforce"}
            - {name: CHAOS_HEARTBEAT_TOPIC, value: "chaos._ops.heartbeat"}
            - {name: CHAOS_PORT, value: "8206"}
            - {name: CHAOS_SHAPE_GUARD_MODE, value: "enforce"}
            - {name: CHAOS_WRITE_PERMISSION_MODE, value: "warn"}
            - {name: GOMEMLIMIT, value: "900MiB"}
            - {name: HOST, value: "0.0.0.0"}
            - {name: OTEL_SERVICE_NAME, value: "chaos"}
            - {name: STELLAR_DB_AUTH, value: "svid"}
            - {name: CHAOS_BIGINT_DATABASE_URL, value: "postgresql://chaos_svid@chaos-db-rw:5432/chaos?pool_max_conns=32&sslmode=verify-full&sslrootcert=/etc/stellar/chaos-db-ca/ca.crt"}
            - {name: STELLAR_PEP_MODE, value: "witness"}
          ports:
            - {name: mcp,  containerPort: 8206}
            - {name: mtls, containerPort: 8207}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: spire-socket, mountPath: /run/spire/agent/public, readOnly: true}
            - {name: orbit, mountPath: /etc/stellar/orbit.toml, subPath: orbit.toml, readOnly: true}
            - {name: chaos-db-ca, mountPath: /etc/stellar/chaos-db-ca, readOnly: true}
      volumes:
        - name: orbit
          configMap: {name: orbit-chaos}
        - {name: tmp, emptyDir: {}}
        - name: spire-socket
          hostPath: {path: /run/spire-k8s/agent/public, type: Directory}
        - name: chaos-db-ca
          secret: {secretName: chaos-db-server-ca, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: Service
metadata:
  name: chaos
  namespace: prime
spec:
  selector: {app: chaos}
  ports:
    - {name: mcp,  port: 8206, targetPort: 8206, protocol: TCP}
    - {name: mtls, port: 8207, targetPort: 8207, protocol: TCP}
