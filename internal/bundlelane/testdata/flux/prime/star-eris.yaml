---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eris-trials
  namespace: prime
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: gaia
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eris-sa
  namespace: prime
  labels: {owner: rob}
  annotations:
    email: owner@example.invalid
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    email: owner@example.invalid
  name: eris
  namespace: prime
  labels: {owner: rob, app: eris, pistis.star: eris}
spec:
  replicas: 1
  selector:
    matchLabels: {app: eris}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  template:
    metadata:
      labels: {app: eris, pistis.star: eris}
    spec:
      enableServiceLinks: false
      restartPolicy: Always
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      serviceAccountName: eris-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: eris
          livenessProbe:
            tcpSocket: {port: 8200}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          image: registry.notusmi.com/rob/eris
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits:   {memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: ['/eris', 'readycheck']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          envFrom:
            - configMapRef: {name: fleet-env}
            - configMapRef: {name: peer-endpoints}
          env:
            - {name: ERIS_BLADE_MODEL, value: "local"}
            - {name: ERIS_BLADE_REF, value: "registry.notusmi.com/rob/stellar_core:blade-debater"}
            - {name: ERIS_BLADE_WALL_SECS, value: "900"}
            - {name: ERIS_BLADE_WORK_ROOT, value: "/opt/stacks/eris/trials"}
            - {name: ERIS_COURT_ENABLED, value: "true"}
            - {name: OTEL_SERVICE_NAME, value: "eris"}
            - {name: PORT, value: "8200"}
            - {name: STELLAR_DB_AUTH, value: "svid"}
            - {name: ERIS_DATABASE_URL, value: "postgresql://eris_svid@aether:5432/eris?sslmode=verify-full&sslrootcert=/etc/stellar/aether-db-ca/ca.crt"}
            - {name: STELLAR_PEP_MODE, value: "witness"}
          ports:
            - {name: mcp,  containerPort: 8200}
            - {name: mtls, containerPort: 8201}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: opt-stacks-eris-trials, mountPath: /opt/stacks/eris/trials}
            - {name: spire-socket, mountPath: /run/spire/agent/public, readOnly: true}
            - {name: orbit, mountPath: /etc/stellar/orbit.toml, subPath: orbit.toml, readOnly: true}
            - {name: aether-db-ca, mountPath: /etc/stellar/aether-db-ca, readOnly: true}
      volumes:
        - name: orbit
          configMap: {name: orbit-eris}
        - {name: tmp, emptyDir: {}}
        - name: opt-stacks-eris-trials
          persistentVolumeClaim: {claimName: eris-trials}
        - name: spire-socket
          hostPath: {path: /run/spire-k8s/agent/public, type: Directory}
        - name: aether-db-ca
          secret: {secretName: aether-db-server-ca, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: Service
metadata:
  name: eris
  namespace: prime
spec:
  selector: {app: eris}
  ports:
    - {name: mcp,  port: 8200, targetPort: 8200, protocol: TCP}
    - {name: mtls, port: 8201, targetPort: 8201, protocol: TCP}
