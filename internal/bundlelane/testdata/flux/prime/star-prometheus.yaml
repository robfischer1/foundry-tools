---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-sa
  namespace: prime
  labels: {owner: rob}
  annotations:
    email: owner@example.invalid
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    email: owner@example.invalid
  name: prometheus
  namespace: prime
  labels: {owner: rob, app: prometheus, pistis.star: prometheus}
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  strategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: prometheus, pistis.star: prometheus}
    spec:
      restartPolicy: Always
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      serviceAccountName: prometheus-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: prometheus
          livenessProbe:
            tcpSocket: {port: 8200}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          image: registry.notusmi.com/rob/prometheus
          resources:
            requests: {cpu: 10m, memory: 896Mi}
            limits:   {memory: 3328Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: ['/prometheus', 'readycheck']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          envFrom:
            - configMapRef: {name: fleet-env}
            - configMapRef: {name: peer-endpoints}
          env:
            - {name: OTEL_SERVICE_NAME, value: "prometheus"}
            - {name: PORT, value: "8200"}
            - {name: PROMETHEUS_HOST, value: "0.0.0.0"}
            - {name: PROMETHEUS_OTEL_ENABLED, value: "true"}
            - {name: PROMETHEUS_PORT, value: "8200"}
            - {name: PROMETHEUS_REDIS_ADDR, value: "tron-redis:6379"}
            - {name: PROMETHEUS_TETHYS_URL, value: "https://oceanus:8210/mcp"}
            - {name: STELLAR_DB_AUTH, value: "svid"}
            - {name: PROMETHEUS_DATABASE_URL, value: "postgresql://prometheus_svid@aether:5432/prometheus?sslmode=verify-full&sslrootcert=/etc/stellar/aether-db-ca/ca.crt"}
            - {name: STELLAR_PEP_MODE, value: "witness"}
          ports:
            - {name: mcp,  containerPort: 8200}
            - {name: mtls, containerPort: 8201}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: spire-socket, mountPath: /run/spire/agent/public, readOnly: true}
            - {name: orbit, mountPath: /etc/stellar/orbit.toml, subPath: orbit.toml, readOnly: true}
            - {name: aether-db-ca, mountPath: /etc/stellar/aether-db-ca, readOnly: true}
      volumes:
        - name: orbit
          configMap: {name: orbit-prometheus}
        - {name: tmp, emptyDir: {}}
        - name: spire-socket
          hostPath: {path: /run/spire-k8s/agent/public, type: Directory}
        - name: aether-db-ca
          secret: {secretName: aether-db-server-ca, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: prime
spec:
  selector: {app: prometheus}
  ports:
    - {name: mcp,  port: 8200, targetPort: 8200, protocol: TCP}
    - {name: mtls, port: 8201, targetPort: 8201, protocol: TCP}
