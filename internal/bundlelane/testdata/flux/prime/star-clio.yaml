---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clio-sa
  namespace: prime
  labels: {owner: rob}
  annotations:
    email: owner@example.invalid
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    email: owner@example.invalid
  name: clio
  namespace: prime
  labels: {owner: rob, app: clio, pistis.star: clio}
spec:
  replicas: 1
  selector:
    matchLabels: {app: clio}
  strategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: clio, pistis.star: clio}
    spec:
      restartPolicy: Always
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      serviceAccountName: clio-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: clio
          livenessProbe:
            tcpSocket: {port: 8206}
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          image: registry.notusmi.com/rob/clio
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits:   {memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec:
              command: ['/clio', 'readycheck']
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          envFrom:
            - configMapRef: {name: fleet-env}
            - configMapRef: {name: peer-endpoints}
          env:
            - {name: CLIO_CONSUMER_GROUP, value: "clio"}
            - {name: CLIO_EMBED_MODEL, value: "bge-m3-FP16.gguf"}
            - {name: CLIO_HEARTBEAT_TOPIC, value: "clio._ops.heartbeat"}
            - {name: CLIO_HISTORY_INGEST_TOPIC, value: "history-ingest"}
            - {name: CLIO_HOST, value: "0.0.0.0"}
            - {name: CLIO_OTEL_ENABLED, value: "true"}
            - {name: CLIO_PORT, value: "8206"}
            - {name: OTEL_SERVICE_NAME, value: "clio"}
            - {name: PORT, value: "8206"}
            - {name: STELLAR_DB_AUTH, value: "svid"}
            - {name: CLIO_DATABASE_URL, value: "postgresql://clio_svid@aether:5432/clio?sslmode=verify-full&sslrootcert=/etc/stellar/aether-db-ca/ca.crt"}
            - {name: STELLAR_PEP_MODE, value: "witness"}
          ports:
            - {name: mcp,  containerPort: 8206}
            - {name: mtls, containerPort: 8207}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: spire-socket, mountPath: /run/spire/agent/public, readOnly: true}
            - {name: orbit, mountPath: /etc/stellar/orbit.toml, subPath: orbit.toml, readOnly: true}
            - {name: aether-db-ca, mountPath: /etc/stellar/aether-db-ca, readOnly: true}
      volumes:
        - name: orbit
          configMap: {name: orbit-clio}
        - {name: tmp, emptyDir: {}}
        - name: spire-socket
          hostPath: {path: /run/spire-k8s/agent/public, type: Directory}
        - name: aether-db-ca
          secret: {secretName: aether-db-server-ca, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clio-consume-sa
  namespace: prime
  labels: {owner: rob}
  annotations:
    email: owner@example.invalid
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    email: owner@example.invalid
  name: clio-consume
  namespace: prime
  labels: {owner: rob, app: clio-consume, pistis.star: clio}
spec:
  replicas: 1
  selector:
    matchLabels: {app: clio-consume}
  strategy: {type: RollingUpdate}
  template:
    metadata:
      labels: {app: clio-consume, pistis.star: clio}
    spec:
      restartPolicy: Always
      dnsConfig:
        options: [{name: ndots, value: "2"}]
      serviceAccountName: clio-consume-sa
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: clio-consume
          image: registry.notusmi.com/rob/clio
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits:   {memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          args: ["/clio-consume"]
          envFrom:
            - configMapRef: {name: fleet-env}
            - configMapRef: {name: peer-endpoints}
          env:
            - {name: CLIO_CONSUMER_GROUP, value: "clio"}
            - {name: CLIO_HISTORY_INGEST_TOPIC, value: "history-ingest"}
            - {name: CLIO_OTEL_ENABLED, value: "true"}
            - {name: OTEL_SERVICE_NAME, value: "clio-consume"}
            - {name: STELLAR_DB_AUTH, value: "svid"}
            - {name: CLIO_DATABASE_URL, value: "postgresql://clio_svid@aether:5432/clio?sslmode=verify-full&sslrootcert=/etc/stellar/aether-db-ca/ca.crt"}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: spire-socket, mountPath: /run/spire/agent/public, readOnly: true}
            - {name: aether-db-ca, mountPath: /etc/stellar/aether-db-ca, readOnly: true}
      volumes:
        - {name: tmp, emptyDir: {}}
        - name: spire-socket
          hostPath: {path: /run/spire-k8s/agent/public, type: Directory}
        - name: aether-db-ca
          secret: {secretName: aether-db-server-ca, items: [{key: ca.crt, path: ca.crt}]}
---
apiVersion: v1
kind: Service
metadata:
  name: clio
  namespace: prime
spec:
  selector: {app: clio}
  ports:
    - {name: mcp,  port: 8206, targetPort: 8206, protocol: TCP}
    - {name: mtls, port: 8207, targetPort: 8207, protocol: TCP}
