# verb-surface.toml - hades's wire surface as a checked-in snapshot.
#
# THE LIVE SURFACE IS NOT READABLE FROM A CI ATOM. hades answers tools/list per
# caller (the PDP-filtered visible set) over a stateful MCP session, and the only
# live-fleet readers a gate atom has are the git door (one file of one repo) and
# hadescall (one verb over mTLS, used by fleet:witness for narcissus). Neither
# lists hades's verbs. So law:verb-liveness grades against this snapshot, and a
# foundry-stocks checkout that carries its own verb-surface.toml at its root
# overrides it, so the snapshot can be refreshed in the repo it grades without
# a foundry-tools release.
#
# REFRESH: the names are the tool list a session sees as mcp__hades__<verb>, with
# the prefix stripped. A verb a block names that is not here is either a typo, a
# verb that was retired (add it to retired-verbs.toml), or a verb this snapshot
# has not caught up with (add it here, sorted).
#
# former_prefixes are verb prefixes of stars that left the surface. A prefix is
# how the atom knows a bare `name_like_this` in backticks is meant as a verb at
# all; the live prefixes are derived from `verbs`, the retired ones from
# retired-verbs.toml, and a star that was retired without ever being ledgered
# is named here.
#
# not_verbs are names that carry a verb's prefix and are not verbs: a hook, a
# metric, a file.

former_prefixes = ["athena"]

not_verbs = ["git_guard"]

