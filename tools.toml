# tools@1: every toolchain, service and tool the atoms run on, by digest or checksum.
#
# The Go constants in internal/checks (images.go, toolpins.go, ops.go, witlane.go,
# hadolintlane.go) stay where they are this step, and TestToolsTomlMatchesGo holds
# this file equal to them, so the two cannot drift. A pin moves in both.
