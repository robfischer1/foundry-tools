# git for a container whose image has none (python, bun, node, playwright's
# noble has it): the golang image's own /usr/bin/git, the toolchain pin the go
# containers already pull. Only git goes on PATH (bins); the rest of that image
# stays behind the container's own tar, ps and sh. Local reads only (diff,
# merge-base, log, cat-file, ls-tree): its git-core helpers and libcurl are not
# the container's.
[tool.git]
kind = "image"
image = "docker.io/library/golang:1.27.3-bookworm@sha256:5c3e9b43cfd3bb95c7937462e29d87ada57b481a96fa23ad0eb61778d7a00110"
bins = ["usr/bin/git"]

# node for a container that has none or only bun's stand-in (the bun image puts
# a bun symlink named node last on PATH): the node toolchain image's own binary,
# first on PATH, so a package's `#!/usr/bin/env node` bin (Stryker, eslint) runs
# under node on both runners.
[tool.node]
kind = "image"
image = "docker.io/library/node:24-bookworm-slim@sha256:2fe369e969550cde8e867afc3fe370b260140cab4a23d467074295b42163d553"
