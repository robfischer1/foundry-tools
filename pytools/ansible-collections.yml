    sha256: 96da7f7b22610567a516756b974ed4b927508604ddef8c986f4090027a5bd8d3
  - name: ansible.netcommon
    version: "8.6.2"
    url: https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/artifacts/ansible-netcommon-8.6.2.tar.gz
    sha256: 4040e782c26ddb97979e03a07f4894a2dc82f59c1e71e7f5c5cb2d5c6a31628a
