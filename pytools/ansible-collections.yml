---
# THE ANSIBLE COLLECTIONS THE TOOLS CONTAINER CARRIES (atoms_tools_python.go).
# ops:ansible syntax-checks a tree whose playbooks name modules from these, and
# a module ansible-core cannot find is a load-time failure, so the collections
# are installed into the image at BUILD time (with a retry for galaxy's cold-miss
# 404s, which the chain paid on a run that changed nothing about them) instead
# of per atom run.
#
# THIS MIRRORS THE GRADED TREE'S DECLARATION: infra's ansible/requirements.yml.
# ops:ansible compares what the tree declares with what this layer provisioned
# and settles could-not-run, naming the difference, when they part; bump the two
# together.
#
# EACH ENTRY NAMES THE ARTIFACT IT IS: `url` is galaxy's download address and
# `sha256` the tarball's sum (galaxy's own v3 record of the version). The
# executor installs NOTHING from galaxy at run time: galaxy redirects artifact
# downloads to S3, which a pod's egress drops (CIEgressDropped, 22 SYNs to
# 52.217.123.170:443), so the pod hung. Daedalus fetches each tarball through the
# tool mirror first (the blob whose digest is the sha256, seeded with
# `just mirror-seed <url> <sha256>`), holds it to the sum, and installs with
# `ansible-galaxy collection install --offline`. The Dagger build above still
# reads the name and version and asks galaxy, which it can reach; ansible-galaxy
# ignores the two extra keys. A bump moves all four fields, and the seed.

collections:
  - name: community.routeros
    version: "3.22.0"
    url: https://galaxy.ansible.com/api/v3/plugin/ansible/content/published/collections/artifacts/community-routeros-3.22.0.tar.gz
    sha256: 45e125b2ec14a336045f7de0d606c9b3678824050223c7fe405e3d229127a05a
  - name: vyos.vyos
    version: "6.0.0"
