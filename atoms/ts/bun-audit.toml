schema = "command-atom@1"
id = "ts:bun-audit"
stage = "prepush"
lane = "ts"
group = "language"
desc = "bun audit reports nothing at high or above."
surface = "root:package.json"
toolchain = "bun"
argv = ["bun", "audit", "--audit-level=high"]
per_module = false
judge = "exit"

# THE REGISTRY IS NAMED, AND IT IS npmjs.org. `bun audit` scans nothing locally:
# it posts the lockfile's package set to the registry's bulk advisory endpoint.
# A proxy mirror serves packages, not that API, so against a mirror the audit
# would ask a host that cannot answer and report a clean audit it never
# performed. Naming the registry for this one command points the question at
# the host that can.
[env]
BUN_CONFIG_REGISTRY = "https://registry.npmjs.org/"
