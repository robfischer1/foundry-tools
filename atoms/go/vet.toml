schema = "command-atom@1"
id = "go:vet"
stage = "precommit"
lane = "go"
group = "language"
desc = "go vet ./... reports nothing."
surface = "any:**/go.mod"
toolchain = "go"
argv = ["go", "vet", "./..."]
