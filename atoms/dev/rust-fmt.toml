schema = "command-atom@1"
id = "dev:rust-fmt"
stage = "dev"
lane = "rust"
group = "language"
desc = "cargo fmt --all rewrites the tree's Rust files in place."
surface = "root:Cargo.toml"
toolchain = "rust"
argv = ["cargo", "fmt", "--all"]
args = "append"
per_module = false
judge = "exit"
writes_tree = true
