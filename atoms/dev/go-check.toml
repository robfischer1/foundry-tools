schema = "command-atom@1"
id = "dev:go-check"
stage = "dev"
lane = "go"
group = "language"
desc = "go vet ./... reports nothing: the commit stage's compile-bearing go atom (go:vet type-checks every package and its tests), run by hand as `check`."
surface = "root:go.mod"
toolchain = "go"
argv = ["go", "vet"]
args = "append"
per_module = false
judge = "exit"

[[default]]
args = ["./..."]
unless = ["@package"]
tail = true
until = "-args"
