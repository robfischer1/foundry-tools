schema = "command-atom@1"
id = "dev:python-lint"
stage = "dev"
lane = "python"
group = "language"
desc = "ruff check is clean over the tree's python, run by hand from the dev lane."
surface = "any:**/*.py"
toolchain = "python"
argv = ["ruff", "check", "--line-length", "100"]
args = "append"
per_module = false
judge = "exit"
needs = ["tool:ruff"]

# THE GATE TWIN IS python:ruff-check: the same ruff, by name on PATH, from the
# same tool:ruff pin (tools.toml [tool.ruff], checks.RuffVersion). With no path
# ruff checks the working directory, so `ruff check` is the twin's `ruff check .`
# and a caller's paths replace it rather than join it.
#
# NOT SHARED: the twin passes `--config <the fleet's ruleset>`, a file it writes
# into ATOM_WORK from the //go:embed in internal/checks/rulesets before ruff
# runs. A manifest has no step that lays a file, so this verb reads the tree's
# own pyproject.toml / ruff.toml, as the star's `ruff check` does. The templates
# pour a mirror of the fleet's ruleset, so the two agree until a star drifts.
# The width is pinned on the command line, `--line-length 100`, the fleet's one
# width (checks.RuffLineLength), so it cannot drift with the tree.
#
# ruff keeps its cache beside the sources and /src is read-only here.
[env]
RUFF_CACHE_DIR = "/tmp/dev-python-lint/ruff-cache"
