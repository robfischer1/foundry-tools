schema = "command-atom@1"
id = "dev:go-test"
stage = "dev"
lane = "go"
group = "language"
desc = "go test -race ./... passes, run by hand from the dev lane."
surface = "root:go.mod"
toolchain = "go"
argv = ["go", "test"]
args = "append"
per_module = false
judge = "exit"
needs = ["dies"]
timeout = "30m"

[[default]]
args = ["-race"]
unless = ["-race", "--race"]
until = "-args"

[[default]]
args = ["./..."]
unless = ["@package"]
tail = true
until = "-args"
