schema = "command-atom@1"
id = "dev:rust-lint"
stage = "dev"
lane = "rust"
group = "language"
desc = "cargo clippy is clean under the fleet's lint set, run by hand from the dev lane under its other name, `lint`."
surface = "root:Cargo.toml"
toolchain = "rust"
argv = ["cargo", "clippy"]
args = "append"
per_module = false
judge = "exit"

[[default]]
args = ["--workspace"]
unless = ["-p", "--package", "--workspace", "--all", "--manifest-path"]
until = "--"

[[default]]
args = ["--all-targets"]
unless = ["--all-targets", "--lib", "--bins", "--bin", "--tests", "--test", "--benches", "--bench", "--examples", "--example"]
until = "--"

[[default]]
args = ["--", "-W", "clippy::all", "-D", "warnings"]
unless = ["--"]
tail = true
