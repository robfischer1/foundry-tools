schema = "command-atom@1"
id = "dev:rust-clippy"
stage = "dev"
lane = "rust"
group = "language"
desc = "cargo clippy is clean under the fleet's lint set, run by hand from the dev lane."
surface = "root:Cargo.toml"
toolchain = "rust"
argv = ["cargo", "clippy", "--workspace", "--all-targets", "--", "-W", "clippy::all", "-D", "warnings"]
args = "append"
per_module = false
judge = "exit"
