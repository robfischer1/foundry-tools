schema = "command-atom@1"
id = "dev:go-typecheck"
stage = "dev"
lane = "go"
group = "language"
desc = "go vet ./... reports nothing, run by hand under the name `typecheck` (dev:go-check's twin: go vet type-checks every package and its tests)."
surface = "root:go.mod"
toolchain = "go"
argv = ["go", "vet"]
args = "append"
per_module = false
judge = "exit"

[[default]]
args = ["./..."]
unless = ["@package"]
tail = true
until = "-args"
