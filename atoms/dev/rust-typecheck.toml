schema = "command-atom@1"
id = "dev:rust-typecheck"
stage = "dev"
lane = "rust"
group = "language"
desc = "cargo check --workspace succeeds, run by hand under the name `typecheck` (dev:rust-check's twin)."
surface = "root:Cargo.toml"
toolchain = "rust"
argv = ["cargo", "check"]
args = "append"
per_module = false
judge = "exit"

[[default]]
args = ["--workspace"]
unless = ["-p", "--package", "--workspace", "--all", "--manifest-path"]
until = "--"
