schema = "lane@1"
lane = "bases"

# As lane build, with the assemble capability iterating bases/*/Dockerfile (it
# reads the lane from its environment); the secret is the build lane's.
[[phase]]
name = "release"
kind = "fanout"
atoms = ["go:release", "python:release", "rust:release", "ts:release", "bases:release", "bases:go-release"]

[[phase]]
name = "assemble"
kind = "sequence"
capability = "assemble"
after = ["release"]

# The chairman base is no image a RUN made: its accounts, links and modes are
# committed files, and bases:chairman holds the assembled layout to them
# (absent in a repository with no bases/chairman). A red here stops the lane
# before anything is scanned or pushed.
[[phase]]
name = "validate"
kind = "fanout"
atoms = ["bases:chairman"]
after = ["assemble"]

[[phase]]
name = "scan"
kind = "sequence"
capability = "scan"
# assemble is named as well as validate: on a tree with no bases/ the validate
# phase's only atom is ABSENT, the phase is empty and done at once, and scan
# would otherwise start before assemble has written /work/image.
after = ["assemble", "validate"]

[[phase]]
name = "publish"
kind = "sequence"
capability = "publish"
after = ["scan"]
secrets = ["ca-build-registry"]
