schema = "lane@1"
lane = "bundle"

# The bundle lane re-gates the policy with two gate atoms (opa test, the
# admission dogfood) and builds the dies in atoms that write /work/bundle
# (internal/bundlekit). THE BUNDLES ARE UNSIGNED (Rob, 2026-10-20): ouranos-opa
# loads the plain :stable artifacts with no key, so nothing signs. The registry
# is the capability's: push-bundle pushes every die under its immutable pin and
# points :stable at it.
[[phase]]
name = "build"
kind = "fanout"
atoms = ["dies:opa-test", "dies:admission-dogfood"]

[[phase]]
name = "policy"
kind = "fanout"
atoms = ["bundle:policy"]
after = ["build"]

[[phase]]
name = "fleet"
kind = "fanout"
atoms = ["bundle:fleet"]
after = ["build"]

# ca-bundle-lane carries REGISTRY_TOKEN (RECIPE_JOB_LANES.bundle.secrets in flux
# prime/daedalus-jobs.yaml), which only the push uses.
[[phase]]
name = "push"
kind = "sequence"
capability = "push-bundle"
after = ["policy", "fleet"]
secrets = ["ca-bundle-lane"]
